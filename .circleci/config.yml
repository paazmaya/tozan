# JavaScript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1
jobs:
  build:
    docker:
      # https://circleci.com/developer/images/image/cimg/node
      # TODO: Pin Docker image to immutable @sha256 digest
      - image: cimg/node:26.13.0

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v24-dependencies-{{ checksum "npm-shrinkwrap.json" }}

      - run: npm ci --ignore-scripts
      - run: npm rebuild --ignore-scripts=false better-sqlite3

      - save_cache:
          paths:
            - node_modules
          key: v24-dependencies-{{ checksum "npm-shrinkwrap.json" }}

      - run: npm run lint
      - run: npm test
